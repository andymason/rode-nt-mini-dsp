<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RØDE NT-USB Mini — DSP</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!--
      This shell is deliberately almost empty. Every effect card is generated by
      app.js from /api/schema, which is rendered from the Go parameter registry
      in internal/dsp/params.go. Adding a parameter there makes it appear here
      with no edit to this file.
    -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <div>
                <h1>NT-USB Mini</h1>
                <p class="brand-sub">DSP control</p>
            </div>
        </div>

        <div class="topbar-actions">
            <!--
              Input level. Measured in the browser with the Web Audio API and
              never sent anywhere; it is the microphone's output, so the
              device's own DSP is already in it.
            -->
            <div class="monitor-inline">
                <button id="mon-btn" class="btn btn-ghost"
                    title="Meter the microphone in the browser. Nothing is sent to the server.">Monitor</button>
                <div class="meter meter-sm" role="img" aria-label="Input level meter">
                    <div class="meter-fill" id="meter-fill"></div>
                    <div class="meter-peak" id="meter-peak"></div>
                </div>
                <span class="meter-readout" id="meter-readout">—∞ dB</span>
            </div>

            <div class="status" id="status" data-state="disconnected">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-text">Disconnected</span>
            </div>

            <button id="connect-btn" class="btn btn-primary">Connect</button>

            <label class="switch-inline" title="Show encoding details, wire bytes and protocol internals">
                <input type="checkbox" id="advanced-toggle" />
                <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
                <span class="switch-label">Advanced</span>
            </label>

            <button id="theme-btn" class="btn btn-icon" title="Toggle light and dark" aria-label="Toggle theme">
                <span aria-hidden="true">◐</span>
            </button>
        </div>
    </header>

    <main>
        <div id="banner" class="banner" hidden></div>

        <!-- Advanced only: protocol context, straight from the schema. -->
        <section id="device-panel" class="device-panel" hidden>
            <h2>Protocol</h2>
            <dl id="device-facts" class="facts"></dl>
            <p class="device-note" id="device-note"></p>
        </section>

        <!--
          Presets: a whole DSP state under a name. The list comes from the
          server, which serves the built-ins plus whatever is in the preset
          file, so nothing about them is written down here either.
        -->
        <section class="presets" id="presets">
            <div class="presets-head">
                <h2>Presets</h2>
                <p class="presets-note" id="preset-note"></p>
            </div>

            <div class="presets-row">
                <select id="preset-select" class="select" aria-label="Preset"></select>
                <button id="preset-load" class="btn btn-primary">Load</button>
                <button id="preset-delete" class="btn btn-ghost">Delete</button>

                <span class="presets-sep" aria-hidden="true"></span>

                <input id="preset-name" class="text-input" type="text" maxlength="64" autocomplete="off"
                    spellcheck="false" placeholder="Save current settings as…" aria-label="New preset name" />
                <button id="preset-save" class="btn">Save</button>

                <span class="presets-sep" aria-hidden="true"></span>

                <!-- The same JSON the tool keeps in its config file, so an
                     exported file can be handed straight back to the CLI with
                     'rode-dsp load --config <file>'. -->
                <button id="export-btn" class="btn">Export JSON</button>
                <button id="import-btn" class="btn">Import JSON</button>
                <input id="import-file" type="file" accept="application/json,.json" hidden />
            </div>
        </section>

        <section id="effects" class="effects" aria-live="polite"></section>

    </main>

    <script src="app.js"></script>
</body>

</html>
