<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RØDE NT-USB Mini — DSP</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!--
      This shell is deliberately almost empty. Every effect card is generated by
      app.js from /api/schema, which is rendered from the Go parameter registry
      in internal/dsp/params.go. Adding a parameter there makes it appear here
      with no edit to this file.
    -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <div>
                <h1>NT-USB Mini</h1>
                <p class="brand-sub">DSP control</p>
            </div>
        </div>

        <div class="topbar-actions">
            <div class="status" id="status" data-state="disconnected">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-text">Disconnected</span>
            </div>

            <button id="connect-btn" class="btn btn-primary">Connect</button>

            <label class="switch-inline" title="Show encoding details, wire bytes and protocol internals">
                <input type="checkbox" id="advanced-toggle" />
                <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
                <span class="switch-label">Advanced</span>
            </label>

            <button id="theme-btn" class="btn btn-icon" title="Toggle light and dark" aria-label="Toggle theme">
                <span aria-hidden="true">◐</span>
            </button>
        </div>
    </header>

    <main>
        <div id="banner" class="banner" hidden></div>

        <!-- Advanced only: protocol context, straight from the schema. -->
        <section id="device-panel" class="device-panel" hidden>
            <h2>Protocol</h2>
            <dl id="device-facts" class="facts"></dl>
            <p class="device-note" id="device-note"></p>
        </section>

        <section id="effects" class="effects" aria-live="polite"></section>

        <section class="monitor">
            <div class="monitor-head">
                <h2>Input level</h2>
                <p class="monitor-note">
                    Measured in the browser with the Web Audio API. Nothing is sent to the server,
                    and it does not read the microphone's DSP — the device has no read-back path.
                </p>
            </div>
            <div class="monitor-body">
                <button id="mon-btn" class="btn">Start monitoring</button>
                <div class="meter" role="img" aria-label="Input level meter">
                    <div class="meter-fill" id="meter-fill"></div>
                    <div class="meter-peak" id="meter-peak"></div>
                </div>
                <span class="meter-readout" id="meter-readout">—∞ dB</span>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
