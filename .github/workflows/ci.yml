name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The whole tool, on the three platforms it claims to support. cgo means
  # these cannot be cross-compiled, so each one has to build on its own runner.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # hidapi needs libudev on Linux; macOS and Windows use frameworks that
      # are already present.
      - name: Install libudev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  # Lint runs once, on Linux. The rules are the same everywhere, and the two
  # platform-specific setup files are both type-checked by the build matrix
  # above.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5

  # The encoder and lookup-table tests are the correctness-critical ones and
  # have no cgo dependency. Running them without libudev keeps that true, so
  # anyone can verify the tables on any machine.
  test-no-cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test protocol and dsp packages
        run: go test ./internal/protocol/... ./internal/dsp/...
